# Local development stack: Postgres, the API and the web app.
# Start with: docker compose up --build
name: erp

services:
  db:
    image: postgres:16
    restart: unless-stopped # comes back by itself when Docker is started again
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Published on localhost only, so tests and tools on the host can reach it.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    command: pnpm --filter @erp/api dev
    environment:
      # the API's own user (created by `pnpm db:roles`) and the owner of the tables (migrations, seed)
      DATABASE_URL: postgres://erp_app:${APP_DB_PASSWORD:-erp_app_dev_password}@db:5432/${POSTGRES_DB}
      DATABASE_OWNER_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DEV_LOGIN_EMAIL: ${DEV_LOGIN_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/drizzle:/app/apps/api/drizzle
      - ./packages/calc/src:/app/packages/calc/src
      # the importer runs inside this container (load, reconcile), so it must be live too
      - ./tools/import-xlsx/src:/app/tools/import-xlsx/src

  web:
    build: .
    restart: unless-stopped
    command: pnpm --filter @erp/web dev
    environment:
      API_URL: http://api:3000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./packages/calc/src:/app/packages/calc/src

volumes:
  db-data:
