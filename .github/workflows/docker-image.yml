# Builds the production images (api and web) and uploads them to GitHub's container registry,
# ghcr.io, from where the server pulls them. See docs/rilascio.md.
#
# It runs when a tag "v*" is pushed (git tag v0.1.0 && git push origin v0.1.0) or by hand from the
# Actions tab ("Run workflow"). Nothing to configure: it signs in with the token GitHub gives to
# every run. It does not run the tests: make the tag on a commit whose CI is green.
name: Docker images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # to upload the images to ghcr.io

jobs:
  build:
    name: Image ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        target: [api, web]

    steps:
      - uses: actions/checkout@v4

      # Registry names must be lowercase, and the owner's name may not be.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.1.0 gives the tags 0.1.0, 0.1 and latest; a run by hand gives sha-<commit>.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          target: ${{ matrix.target }}
          # amd64 is what a normal server is; arm64 would be added here (and makes the build much slower)
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # no extra "attestation" entries in the registry: only the image
          provenance: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
